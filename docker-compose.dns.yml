# ═══════════════════════════════════════════════════════════════════════════════
# DNS STACK (STABLE HOMELAB)
#
# Runs Pi-hole on the HOST network so DNS never depends on Docker networking.
#
# Why this matters:
# - No more static Docker IPs for DNS
# - No more "docker compose down" killing your whole LAN's DNS unexpectedly
# - Faster/more reliable boot (no bridge IP race)
#
# Access:
# - DNS: NAS_IP:53
# - UI : http://NAS_IP:8081/admin
# ═══════════════════════════════════════════════════════════════════════════════

name: dns

networks:
  pihole-lan:
    driver: macvlan
    driver_opts:
      parent: ${LAN_INTERFACE}  # Network interface - check with: ip link show
    ipam:
      config:
        - subnet: ${LAN_SUBNET}
          gateway: ${LAN_GATEWAY}
services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    networks:
      arr-stack:
      # macvlan gives Traefik its own LAN IP where it can use port 80
      # (NAS owns port 80 on its IP, but Traefik owns it on TRAEFIK_LAN_IP)
      pihile-lan:
        ipv4_address: ${PIHOLE_LAN_IP}
        mac_address: ${PIHOLE_LAN_MAC}
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp"
      - "8081:8080" # Pihole Dashboard
    environment:
      TZ: ${TZ}
      #FTLCONF_webserver_port: "8081" #if in network-mode: host
      FTLCONF_webserver_api_password: ${PIHOLE_UI_PASS}
      FTLCONF_dns_listeningMode: all
    volumes:
      - pihole-etc-pihole:/etc/pihole
      - pihole-etc-dnsmasq:/etc/dnsmasq.d
      - ./pihole/02-local-dns.conf:/etc/dnsmasq.d/02-local-dns.conf:ro
    cap_add:
      - NET_ADMIN
      - CAP_SYS_TIME
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "dig", "@127.0.0.1", "-p", "53", "google.com", "+short"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 30s

volumes:
  pihole-etc-pihole:
  pihole-etc-dnsmasq:
