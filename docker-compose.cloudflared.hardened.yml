# ═══════════════════════════════════════════════════════════════════════════════
# CLOUDFLARE TUNNEL - Secure remote access without port forwarding (Anywhere setup)
#
# What it does:
# - Creates an encrypted tunnel from your NAS to Cloudflare's network
# - Routes your public hostnames (e.g., jellyfin.${DOMAIN}) to internal services
# - No inbound ports exposed on your router
#
# Notes:
# - Keep this stack independent so restarting other stacks doesn't kill the tunnel.
# - Prefer "unless-stopped" to avoid restart loops during maintenance.
# ═══════════════════════════════════════════════════════════════════════════════

name: cloudflared

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.2.0
    container_name: cloudflared
    command: tunnel --config /home/nonroot/.cloudflared/config.yml run
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared:ro
    networks:
      - arr-stack
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info", "nas-tunnel"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "deunhealth.restart.on.unhealthy=true"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  arr-stack:
    external: true
