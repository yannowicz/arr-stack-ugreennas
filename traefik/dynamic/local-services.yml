# Local .lan domain routing (port-free access)
#
# How it works:
# 1. Pi-hole DNS resolves *.lan → Traefik macvlan IP (192.168.1.253)
# 2. Browser requests http://sonarr.lan → Traefik on port 80 (macvlan IP)
# 3. Traefik matches Host header → routes to correct service:port
#
# Note:
# - Pi-hole UI is assumed to be host-networked on the NAS and is NOT routed via Traefik.
# - Backends are referenced by Docker service name (more stable than hard-coded container IPs).

http:
  routers:
    # === Media Services ===
    jellyfin-lan:
      rule: "Host(`jellyfin.lan`)"
      entryPoints: [web]
      service: jellyfin-lan

    jellyseerr-lan:
      rule: "Host(`jellyseerr.lan`)"
      entryPoints: [web]
      service: jellyseerr-lan

    # Typo redirects (jellyseer -> jellyseerr)
    jellyseer-lan:
      rule: "Host(`jellyseer.lan`)"
      entryPoints: [web]
      middlewares: [jellyseer-redirect]
      service: jellyseerr-lan

    # === *arr Stack (VPN-protected via Gluetun) ===
    sonarr-lan:
      rule: "Host(`sonarr.lan`)"
      entryPoints: [web]
      service: sonarr-lan

    radarr-lan:
      rule: "Host(`radarr.lan`)"
      entryPoints: [web]
      service: radarr-lan

    prowlarr-lan:
      rule: "Host(`prowlarr.lan`)"
      entryPoints: [web]
      service: prowlarr-lan

    lidarr-lan:
      rule: "Host(`lidarr.lan`)"
      entryPoints: [web]
      service: lidarr-lan

    mylar3-lan:
      rule: "Host(`mylar3.lan`)"
      entryPoints: [web]
      service: mylar3-lan

    bazarr-lan:
      rule: "Host(`bazarr.lan`)"
      entryPoints: [web]
      service: bazarr-lan

    # === Download Clients ===
    qbit-lan:
      rule: "Host(`qbit.lan`)"
      entryPoints: [web]
      service: qbit-lan

    sabnzbd-lan:
      rule: "Host(`sabnzbd.lan`)"
      entryPoints: [web]
      service: sabnzbd-lan

    # === Infrastructure ===
    traefik-lan:
      rule: "Host(`traefik.lan`)"
      entryPoints: [web]
      service: api@internal

    pihole-lan:
      rule: "Host(`pihole.lan`)"
      entryPoints: [web]
      service: pihole-lan

    # === Utilities ===
    uptime-lan:
      rule: "Host(`uptime.lan`)"
      entryPoints: [web]
      service: uptime-lan

    duc-lan:
      rule: "Host(`duc.lan`)"
      entryPoints: [web]
      service: duc-lan

    beszel-lan:
      rule: "Host(`beszel.lan`)"
      entryPoints: [web]
      service: beszel-lan

  middlewares:
    jellyseer-redirect:
      redirectRegex:
        regex: "^http://jellyseer[.]lan(.*)"
        replacement: "http://jellyseerr.lan${1}"
        permanent: true

  services:
    # === Media Services ===
    jellyfin-lan:
      loadBalancer:
        servers:
          - url: "http://jellyfin:8096"

    jellyseerr-lan:
      loadBalancer:
        servers:
          - url: "http://jellyseerr:5055"

    # === *arr Stack (via Gluetun service) ===
    sonarr-lan:
      loadBalancer:
        servers:
          - url: "http://gluetun:8989"

    radarr-lan:
      loadBalancer:
        servers:
          - url: "http://gluetun:7878"

    prowlarr-lan:
      loadBalancer:
        servers:
          - url: "http://gluetun:9696"

    lidarr-lan:
      loadBalancer:
        servers:
          - url: "http://gluetun:8686"

    mylar3-lan:
      loadBalancer:
        servers:
          - url: "http://gluetun:8090"

    bazarr-lan:
      loadBalancer:
        servers:
          - url: "http://bazarr:6767"

    # === Download Clients (via Gluetun) ===
    qbit-lan:
      loadBalancer:
        servers:
          - url: "http://gluetun:8085"

    sabnzbd-lan:
      loadBalancer:
        servers:
          - url: "http://gluetun:8080"

    # === Infrastructure ===
    pihole-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.5:80"

    # === Utilities ===
    uptime-lan:
      loadBalancer:
        servers:
          - url: "http://uptime:3001"

    duc-lan:
      loadBalancer:
        servers:
          - url: "http://duc:80"

    beszel-lan:
      loadBalancer:
        servers:
          - url: "http://beszel:8090"