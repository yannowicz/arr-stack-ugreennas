# Local .lan domains for port-free service access
#
# Most services resolve to Traefik's macvlan IP (192.168.1.253), where Traefik listens on port 80
# and routes by Host header to the correct backend.
#
# IMPORTANT:
# - Pi-hole is assumed to run in host network mode on the NAS (192.168.1.10)
# - Therefore pihole.lan should resolve DIRECTLY to the NAS IP, not Traefik.
#
# Apply then reload dnsmasq inside Pi-hole:
#   docker exec pihole pihole reloaddns

# Media services
address=/jellyfin.lan/192.168.1.253
address=/jellyseerr.lan/192.168.1.253

# *arr stack (VPN-protected)
address=/sonarr.lan/192.168.1.253
address=/radarr.lan/192.168.1.253
address=/prowlarr.lan/192.168.1.253
address=/bazarr.lan/192.168.1.253
address=/lidarr.lan/192.168.1.253
#address=/mylar3.lan/192.168.1.253

# Download clients
address=/qbit.lan/192.168.1.253
address=/sabnzbd.lan/192.168.1.253

# Infrastructure
address=/traefik.lan/192.168.1.253
address=/pihole.lan/192.168.1.253

# Utilities
address=/uptime.lan/192.168.1.253
address=/duc.lan/192.168.1.253
address=/beszel.lan/192.168.1.253

# Direct IP (not routed via Traefik)
address=/flaresolverr.lan/172.20.0.10

