#######################################################################
# ARR + VPN + MEDIA STACK
#
# Safe restart:
#   docker compose -f docker-compose.arr-stack.hardened.yml up -d --force-recreate
#
# NOTE: Pi-hole is moved to docker-compose.dns.yml (host network) for stability.
#######################################################################
name: arr-stack

#########################
# Centralized Volumes   #
#########################
volumes:
  gluetun-config:
  qbittorrent-config:
  sabnzbd-config:
  sonarr-config:
  prowlarr-config:
  radarr-config:
  lidarr-config:
  mylar3-config:
  bazarr-config:
  jellyseerr-config:
  jellyfin-config:
  jellyfin-cache:

#########################
# Networks              #
#########################
networks:
  vpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.8.1.0/24
  arr-stack:
    external: true

#########################
# Logging               #
#########################
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

#########################
# Services              #
#########################
services:
  # ═══════════════════════════════════════════════════════════════════════════
  # GLUETUN - VPN gateway. Routes download traffic through your VPN provider.
  # All services below marked "via VPN" share this network for privacy.
  # ═══════════════════════════════════════════════════════════════════════════
  gluetun:
    #image: qmcgaw/gluetun:v3.41
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    init: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - gluetun-config:/gluetun
    environment:
      # VPN Configuration - see .env.example for provider-specific setup
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE}
      # - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      OPENVPN_USER: ${OPENVPN_USER}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES}
      SERVER_CITIES: ${SERVER_CITIES}
      SERVER_CATEGORIES: ${SERVER_CATEGORIES}
      # - SERVER_HOSTNAME=${SERVER_HOSTNAME}
      TZ: ${TZ}
      DNS_ADDRESS: "1.1.1.1"
      DOT: "on"
      FIREWALL_VPN_INPUT_PORTS: "8989,7878,9696,8686,8090,8085,8080,8096,5055,6767"
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET},172.20.0.0/24,10.8.1.0/24
    ports:
      # Ports for services using network_mode: "service:gluetun"
      # Enables direct local access without Traefik (http://NAS_IP:PORT)
      - "8989:8989"   # Sonarr
      - "7878:7878"   # Radarr
      - "9696:9696"   # Prowlarr
      - "8686:8686"   # Lidarr
      - "8090:8090"   # Mylar3
      - "8085:8085"   # qBittorrent
      - "8082:8080"   # SABnzbd
    networks:
      arr-stack:
      vpn-net:
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s  # Give VPN time to establish connection

  # ═══════════════════════════════════════════════════════════════════════════
  # QBITTORRENT - Torrent download client. Downloads files through VPN.
  # Access: qbit.lan | qbit.yourdomain.com | NAS_IP:8085
  # ═══════════════════════════════════════════════════════════════════════════
  qbittorrent:
    #image: lscr.io/linuxserver/qbittorrent:5.1.4
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8085
      DOCKER_MODS: ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - qbittorrent-config:/config
      - ${ARR_DATA}/torrents:/data/torrents
    labels:
      - deunhealth.restart.on.unhealthy=true
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/ && wget -q --spider --timeout=5 http://www.google.com"]
      interval: 2m
      timeout: 15s
      retries: 2
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # SABNZBD - Usenet download client. Downloads via VPN for extra security.
  # Access: sabnzbd.lan | sabnzbd.yourdomain.com | NAS_IP:8082
  # ═══════════════════════════════════════════════════════════════════════════
  #sabnzbd:
  #  #image: lscr.io/linuxserver/sabnzbd:4.5.5
  #  image: lscr.io/linuxserver/sabnzbd:latest
  #  container_name: sabnzbd
  #  network_mode: "service:gluetun"
  #  depends_on:
  #    gluetun:
  #      condition: service_healthy
  #      restart: true
  #  environment:
  #    - PUID=${PUID}
  #    - PGID=${PGID}
  #    - TZ=${TZ}
  #  volumes:
  #    - /etc/localtime:/etc/localtime:ro
  #    - sabnzbd-config:/config
  #    - ${ARR_DATA}/usenet:/data/usenet:rw
  #
  #  labels:
  #    - deunhealth.restart.on.unhealthy=true
  #  restart: always
  #  logging: *default-logging
  #  healthcheck:
  #    test: ["CMD-SHELL", "curl -sf http://localhost:8080/ && wget -q --spider --timeout=5 http://www.google.com"]
  #    interval: 3m
  #    timeout: 15s
  #    retries: 2
  #    start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # PROWLARR - Indexer manager. Finds download sources for Sonarr/Radarr.
  # Access: prowlarr.lan | prowlarr.yourdomain.com | NAS_IP:9696
  # ═══════════════════════════════════════════════════════════════════════════
  prowlarr:
    #image: lscr.io/linuxserver/prowlarr:2.3.0
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - prowlarr-config:/config
    labels:
      - deunhealth.restart.on.unhealthy=true
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9696/ && wget -q --spider --timeout=5 http://www.google.com"]
      interval: 2m
      timeout: 15s
      retries: 2
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # RADARR - Movie monitor. Watches for new movies and sends to download.
  # Access: radarr.lan | radarr.yourdomain.com | NAS_IP:7878
  # ═══════════════════════════════════════════════════════════════════════════
  radarr:
    #image: lscr.io/linuxserver/radarr:6.0.4
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - radarr-config:/config
      - ${ARR_DATA}:/data
    labels:
      - deunhealth.restart.on.unhealthy=true
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7878/ && wget -q --spider --timeout=5 http://www.google.com"]
      interval: 2m
      timeout: 15s
      retries: 2
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # SONARR - TV show monitor. Watches for new episodes and sends to download.
  # Access: sonarr.lan | sonarr.yourdomain.com | NAS_IP:8989
  # ═══════════════════════════════════════════════════════════════════════════
  sonarr:
    #image: lscr.io/linuxserver/sonarr:4.0.16
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - sonarr-config:/config
      - ${ARR_DATA}:/data
    labels:
      - deunhealth.restart.on.unhealthy=true
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8989/ && wget -q --spider --timeout=5 http://www.google.com"]
      interval: 2m
      timeout: 15s
      retries: 2
      start_period: 60s

  
  # ═══════════════════════════════════════════════════════════════════════════
  # LIDARR - Music monitor. SWatches for new music and sends to download.
  # Access: lidarr.lan | lidarr.yourdomain.com | NAS_IP:8686
  # ═══════════════════════════════════════════════════════════════════════════  
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - lidarr-config:/config
      - ${ARR_DATA}:/data
    labels:
      - deunhealth.restart.on.unhealthy=true
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8686/ && wget -q --spider --timeout=5 http://www.google.com"]
      interval: 2m
      timeout: 15s
      retries: 2
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # MYLAR3 - Comics monitor. SWatches for new Comics and sends to download.
  # Access: mylar3.lan | mylar3.yourdomain.com | NAS_IP:8090
  # ═══════════════════════════════════════════════════════════════════════════
  #mylar3:
  #  image: lscr.io/linuxserver/mylar3:latest
  #  container_name: mylar3
  #  network_mode: "service:gluetun"
  #  depends_on:
  #    gluetun:
  #      condition: service_healthy
  #      restart: true
  #  environment:
  #    - PUID=${PUID}
  #    - PGID=${PGID}
  #    - TZ=${TZ}
  #  volumes:
  #    - mylar3-config:/config
  #    - ${BOOK}:/books
  #    - ${MEDIA_DOWNLOAD}/mylar3:/downloads
  #  labels:
  #    - deunhealth.restart.on.unhealthy=true
  #  restart: always
  #  logging: *default-logging
  #  healthcheck:
  #    test: ["CMD-SHELL", "curl -sf http://localhost:8090/ && wget -q --spider --timeout=5 http://www.google.com"]
  #    interval: 2m
  #    timeout: 15s
  #    retries: 2
  #    start_period: 60s  

  # ═══════════════════════════════════════════════════════════════════════════
  # JELLYFIN - Media server. Stream your movies and TV shows like Netflix.
  # Access: jellyfin.lan | jellyfin.yourdomain.com | NAS_IP:8096
  # ═══════════════════════════════════════════════════════════════════════════
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"     # Web UI
      - "7359:7359/udp" # Client discovery (auto-detect on LAN)
      - "1900:1900/udp" # DLNA
    environment:
      TZ: ${TZ}
    # Hardware transcoding (Intel Quick Sync) - remove these 4 lines if no Intel GPU
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GROUP_ID:-0}"  # Find ID: getent group render | cut -d: -f3
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${ARR_DATA}/media:/data/media/:ro
      - ${MEDIA_ROOT}/Video/:/data/Video:ro
    networks:
      arr-stack:
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 1m
      timeout: 30s
      retries: 2
      start_period: 30s

  
  # ═══════════════════════════════════════════════════════════════════════════
  # JELLYSEERR - Request portal. Users request movies/shows here.
  # Access: jellyseerr.lan | jellyseerr.yourdomain.com | NAS_IP:5055
  # ═══════════════════════════════════════════════════════════════════════════
  jellyseerr:
    #image: fallenbagel/jellyseerr:2.7
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    depends_on:
      gluetun:
        condition: service_healthy  # Needs gluetun to reach Sonarr/Radarr
        restart: true
    ports:
      - "5055:5055"  # Local network access (all interfaces)
    environment:
      LOG_LEVEL: info
      TZ: ${TZ}
      PORT: 5055
    networks:
      arr-stack:
    volumes:
      - jellyseerr-config:/app/config
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:5055/api/v1/status"]
      interval: 2m
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # BAZARR - Subtitle manager. Automatically downloads subtitles.
  # Access: bazarr.lan | bazarr.yourdomain.com | NAS_IP:6767
  # ═══════════════════════════════════════════════════════════════════════════
  bazarr:
    #image: lscr.io/linuxserver/bazarr:v1.5.5
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    depends_on:
      gluetun:
        condition: service_healthy  # Needs gluetun to reach Sonarr/Radarr
        restart: true
    ports:
      - "6767:6767"  # Local network access
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    networks:
      arr-stack:
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - bazarr-config:/config
      - ${MEDIA_ROOT}/media:/data/media
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/"]
      interval: 3m
      timeout: 10s
      retries: 2
    
  # ═══════════════════════════════════════════════════════════════════════════
  # FLARESOLVERR - Cloudflare bypass. Helps Prowlarr access protected sites.
  # No web UI. Used internally by Prowlarr at 172.20.0.10:8191
  # ═══════════════════════════════════════════════════════════════════════════
  flaresolverr:
    #image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
      TZ: ${TZ}
    networks:
      arr-stack:
    labels:
      - deunhealth.restart.on.unhealthy=true
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # Actually test Chrome by making a solve request (catches Chrome crashes)
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json",
             "-d", "{\"cmd\":\"request.get\",\"url\":\"http://localhost:8191/\",\"maxTimeout\":30000}",
             "http://localhost:8191/v1"]
      interval: 10m
      timeout: 60s
      retries: 2
      start_period: 2m